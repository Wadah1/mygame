<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر التطبيقات النظيفة - Open App Store</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 20px; text-align: center; }
        header { margin-bottom: 30px; }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        p.subtitle { color: #7f8c8d; font-size: 14px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: right; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 60px; height: 60px; border-radius: 12px; margin-bottom: 10px; }
        .card h3 { margin-bottom: 5px; color: #2c3e50; }
        .card p { font-size: 13px; color: #666; margin-bottom: 15px; line-height: 1.4; }
        .badge { display: inline-block; background: #e8f5e9; color: #2e7d32; font-size: 11px; padding: 4px 8px; border-radius: 6px; margin-bottom: 10px; }
        .btn-download { display: block; text-align: center; background: #3498db; color: white; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; }
        .btn-download:hover { background: #2980b9; }
    </style>
</head>
<body>

    <header>
        <h1>متجر التطبيقات النظيفة</h1>
        <p class="subtitle">تطبيقات مفتوحة المصدر ومعدلة - بدون إعلانات وبدون اشتراكات</p>
    </header>

    <div class="grid">
        <!-- تطبيق تجريبي -->
        <div class="card">
            <span class="badge">بدون إعلانات</span>
            <h3>تطبيق تجريبي 1</h3>
            <p>نسخة مطورة وخالية تماماً من أي إعلانات مزعجة أو قيود مدفوعة.</p>
            <a href="#" class="btn-download">تحميل APK</a>
        </div>
    </div>

</body>
</html>
