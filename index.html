<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mining Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #fff; text-align: center; font-family: sans-serif; margin: 0; padding-top: 50px; }
        .coin { width: 200px; height: 200px; background: linear-gradient(145deg, #ffcc00, #ff9900); 
                border-radius: 50%; margin: 20px auto; display: flex; align-items: center; 
                justify-content: center; font-size: 80px; cursor: pointer; 
                box-shadow: 0 0 20px #ffcc00; transition: 0.1s; }
        .coin:active { transform: scale(0.9); }
        h1 { font-size: 24px; color: #ffcc00; }
    </style>
</head>
<body>
    <h1>اضغط لجمع النقاط!</h1>
    <div class="coin" onclick="tap()">💰</div>
    <h2 id="score">0</h2>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // يفتح اللعبة بشاشة كاملة
        let points = 0;

        function tap() {
            points++;
            document.getElementById('score').innerText = points;
            tg.HapticFeedback.impactOccurred('medium'); // اهتزاز بسيط عند اللمس
        }
    </script>
</body>
</html>
